[project]
name = "sme-backend"
version = "0.1.0"
description = "SME Financial Health Early-Warning API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-dotenv>=1.0",
  "mangum>=0.17",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
